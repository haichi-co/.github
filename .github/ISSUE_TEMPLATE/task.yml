name: Task
description: Define a specific, independently verifiable unit of work.
type: Task
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What will be different when this task is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include explicit out-of-scope boundaries where relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable, testable conditions for completion.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests, checks, or other evidence needed to validate completion.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or blockers
      description: Link prerequisite work or unresolved decisions, if any.
