name: Feature
description: Propose a new capability or enhancement.
type: Feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should this feature enable?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included or explicitly excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable conditions define success?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or blockers
      description: Link related issues or unresolved decisions, if any.
