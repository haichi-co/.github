name: Sync organization agent skills

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/skill-sync.json'
      - '.github/skill-sync-policy.json'
      - 'src/skill-sync.ts'
      - 'src/skill-sync.test.ts'
      - 'src/skill-sync-policy.ts'
      - 'src/skill-sync-policy.test.ts'
      - 'tsconfig.json'
      - '.github/workflows/sync-skills.yml'
  schedule:
    - cron: '19 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without creating commits or pull requests
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  # Read-only PR checks must not cancel pending writer runs or other PRs.
  group: ${{ github.event_name == 'pull_request' && format('haichi-skill-sync-pr-{0}', github.ref) || 'haichi-skill-sync' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pinned type-check tools
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@24.10.13 undici-types@7.16.0

      - name: Type-check TypeScript (no emit)
        run: ./node_modules/.bin/tsc --noEmit --project tsconfig.json

      - name: Validate manifest and sync engine
        run: |
          node --test src/skill-sync.test.ts src/skill-sync-policy.test.ts src/repo-admin-reconcile.test.ts src/issue-lifecycle-contract.test.ts
          node src/skill-sync-policy.ts --validate-config
          node src/skill-sync.ts --validate-config
          node src/repo-admin-reconcile.ts --validate-config

  sync:
    needs: verify
    # The environment is separately configured by the owner for branch main only.
    # Do not use a mutable repository/org variable to authorize synchronization.
    if: >-
      github.repository == 'haichi-co/.github' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: skill-sync
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out canonical skill files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Authorize reviewed policy and current main
        id: authorization
        env:
          CONFIGURED_APP_CLIENT_ID: ${{ vars.SKILL_SYNC_APP_CLIENT_ID }}
          READ_TOKEN: ${{ github.token }}
        run: node src/skill-sync-policy.ts --authorize

      - name: Mint read-only organization discovery token
        if: steps.authorization.outputs.enabled == 'true'
        id: discovery-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ steps.authorization.outputs.client-id }}
          private-key: ${{ secrets.SKILL_SYNC_APP_PRIVATE_KEY }}
          owner: haichi-co
          permission-contents: read
          permission-pull-requests: read

      - name: Discover opted-in repositories
        if: steps.authorization.outputs.enabled == 'true'
        id: targets
        env:
          GH_TOKEN: ${{ steps.discovery-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          targets="$(node src/skill-sync.ts --discover-targets)"
          repositories="$(SKILL_SYNC_TARGETS="$targets" node src/skill-sync.ts --target-repositories)"
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"
          printf 'repositories=%s\n' "$repositories" >> "$GITHUB_OUTPUT"
          if [[ -z "$repositories" ]]; then
            echo "No repositories enrolled; skipping write token and synchronization."
          fi

      - name: Recheck authorization before writer token
        if: steps.authorization.outputs.enabled == 'true' && steps.targets.outputs.repositories != ''
        env:
          CONFIGURED_APP_CLIENT_ID: ${{ vars.SKILL_SYNC_APP_CLIENT_ID }}
          READ_TOKEN: ${{ github.token }}
        run: node src/skill-sync-policy.ts --assert-authorized

      - name: Mint repository-scoped GitHub App token
        if: steps.authorization.outputs.enabled == 'true' && steps.targets.outputs.repositories != ''
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ steps.authorization.outputs.client-id }}
          private-key: ${{ secrets.SKILL_SYNC_APP_PRIVATE_KEY }}
          owner: haichi-co
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write

      - name: Recheck authorization before synchronization
        if: steps.authorization.outputs.enabled == 'true' && steps.targets.outputs.repositories != ''
        env:
          CONFIGURED_APP_CLIENT_ID: ${{ vars.SKILL_SYNC_APP_CLIENT_ID }}
          READ_TOKEN: ${{ github.token }}
        run: node src/skill-sync-policy.ts --assert-authorized

      - name: Synchronize managed skill files
        if: steps.authorization.outputs.enabled == 'true' && steps.targets.outputs.repositories != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SKILL_SYNC_TARGETS: ${{ steps.targets.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            node src/skill-sync.ts --dry-run
          else
            node src/skill-sync.ts
          fi
